<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Telco Jargons</title>
  <meta name="description" content="Quickly look up telecom abbreviations and their full forms." />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --font-sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --animate-fade-up: fade-up 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      --animate-pop: pop 0.18s ease-out;
      --animate-sweep: sweep 0.2s linear both;
      --animate-float: float 6s ease-in-out infinite;

      @keyframes fade-up {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.012); }
        100% { transform: scale(1); }
      }
      @keyframes sweep {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
    }

    /* Typing state: glowing border while the user is typing. */
    #search-wrap.is-typing #search {
      @apply border-sky-500 ring-8 ring-sky-300/50;
    }
    #search-wrap.is-typing .typing-bar {
      @apply animate-sweep;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-sky-100 via-sky-50 to-white font-sans text-slate-900 antialiased">
  <main class="mx-auto flex max-w-2xl flex-col px-5 pt-[12vh] pb-16">
    <header class="mb-10 flex flex-col items-center text-center">
      <img
        id="logo"
        src="assets/gp-logo.webp"
        alt="Grameenphone"
        width="72"
        height="72"
        class="mb-5 h-18 w-18 animate-float drop-shadow-sm"
        onerror="this.hidden = true"
      />
      <h1 class="text-4xl font-bold tracking-tight text-slate-800 sm:text-5xl">Telco Jargons</h1>
      <p class="mt-3 text-lg text-slate-500">Look up any telecom abbreviation in a keystroke.</p>
    </header>

    <div id="search-wrap" class="relative">
      <label for="search" class="sr-only">Search a jargon</label>
      <input
        id="search"
        type="search"
        autocomplete="off"
        spellcheck="false"
        autofocus
        placeholder="Type a jargon, e.g. BSS"
        role="combobox"
        aria-autocomplete="list"
        aria-expanded="false"
        aria-controls="suggestions"
        class="w-full rounded-2xl border-2 border-sky-200 bg-white px-6 py-5 text-xl sm:text-2xl shadow-lg shadow-sky-200/50 outline-none transition-all duration-200 placeholder:text-slate-300 focus:border-sky-400 focus:ring-4 focus:ring-sky-100"
      />
      <!-- Sweeps across while the debounce timer is pending. -->
      <div class="pointer-events-none absolute inset-x-5 bottom-0 h-0.5 overflow-hidden rounded-full">
        <div class="typing-bar h-full origin-left scale-x-0 bg-gradient-to-r from-sky-400 to-blue-500"></div>
      </div>
      <ul
        id="suggestions"
        role="listbox"
        hidden
        class="absolute z-10 mt-3 max-h-96 w-full overflow-auto rounded-2xl border border-sky-100 bg-white/95 py-2 shadow-xl shadow-sky-200/40 backdrop-blur"
      ></ul>
    </div>

    <p id="hint" class="mt-4 text-center text-sm text-slate-400">
      <button id="count" type="button" aria-expanded="false" aria-controls="all-list" title="Show all jargons"
              class="cursor-pointer rounded px-1 underline decoration-dotted underline-offset-4 hover:text-sky-600">&nbsp;</button>
      <span class="hidden sm:inline">
        &middot; <kbd class="rounded border border-slate-200 bg-white px-1.5 py-0.5 font-sans text-xs text-slate-500">&uarr;</kbd> <kbd class="rounded border border-slate-200 bg-white px-1.5 py-0.5 font-sans text-xs text-slate-500">&darr;</kbd> to navigate
        &middot; <kbd class="rounded border border-slate-200 bg-white px-1.5 py-0.5 font-sans text-xs text-slate-500">Enter</kbd> to select
        &middot; <kbd class="rounded border border-slate-200 bg-white px-1.5 py-0.5 font-sans text-xs text-slate-500">/</kbd> to search
      </span>
    </p>

    <div id="empty" hidden class="mt-6 animate-fade-up text-center text-lg text-slate-500">
      <p id="empty-text">No match found.</p>
      <a id="request" href="#" target="_blank" rel="noopener"
         class="mt-3 inline-block rounded-full bg-white px-5 py-2 text-base font-medium text-sky-600 shadow-sm ring-1 ring-sky-200 transition hover:bg-sky-50 hover:ring-sky-300">
        Missing? Request <span id="request-term" class="font-semibold"></span> &rarr;
      </a>
    </div>

    <section id="result" hidden aria-live="polite" class="mt-12 animate-fade-up rounded-3xl bg-white/70 px-6 py-10 text-center shadow-sm ring-1 ring-sky-100">
      <p id="result-abbr" class="text-6xl font-bold tracking-tight text-sky-600"></p>
      <p id="result-full" class="mt-4 text-3xl text-slate-800"></p>
      <p id="result-desc" class="mx-auto mt-5 max-w-lg text-lg leading-relaxed text-slate-500"></p>
    </section>

    <section id="all-list" hidden aria-label="All jargons" class="mt-8 animate-fade-up">
      <div id="tiles" class="grid grid-cols-2 gap-3 sm:grid-cols-3"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
